<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6f91">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Suria Tools：免费、快速的在线工具箱，提供图片压缩、图标尺寸编辑、文本、开发、时间、设计和网络工具。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="Suria Tools">
  <meta property="og:description" content="打开即用的实用在线工具箱">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="final.css">
  <link rel="stylesheet" href="polish.css">
  <link rel="stylesheet" href="enhancements.css">
  <title>Suria Tools</title>
</head>
<body>
  <aside id="sidebar" class="sidebar">
    <button class="brand" data-home><span class="logo">S</span><span><b>Suria Tools</b><small>在线工具箱</small></span></button>
    <nav id="nav"></nav>
    <div class="sidebar-foot"><button id="themeBtn" class="ghost">🌙 深色模式</button><button id="resetBtn" class="ghost">↺ 重置本地设置</button></div>
  </aside>
  <main>
    <header class="topbar">
      <button id="menuBtn" class="icon-button" aria-label="打开分类导航">☰</button>
      <div class="search"><span>⌕</span><input id="search" autocomplete="off" aria-label="搜索工具" placeholder="搜索工具、用途或英文名称…"><kbd>/</kbd></div>
      <button id="installBtn" class="ghost hidden">安装应用</button>
    </header>
    <section id="homeView">
      <div class="content">
        <section><div class="section-head"><div><h2>全部工具</h2><p id="resultText"></p></div></div><div id="allTools"></div></section>
        <section id="commonSection"><div class="section-head"><div><h2>我的常用</h2></div></div><div id="common" class="tool-grid compact"></div></section>
        <section id="recentSection"><div class="section-head"><div><h2>最近使用</h2></div></div><div id="recent" class="tool-grid compact"></div></section>
        <section id="favoriteSection"><div class="section-head"><div><h2>我的收藏</h2></div></div><div id="favorites" class="tool-grid compact"></div></section>
        <section id="workspaceSection"><div class="section-head"><div><h2>我的工作台</h2></div><button id="newWorkspace" class="secondary">＋ 新建</button></div><div id="workspaceList" class="workspace-grid"></div></section>
      </div>
    </section>
    <section id="toolView" class="content hidden">
      <button id="backBtn" class="back">← 返回工具列表</button>
      <article class="tool-page"><header class="tool-header"><div><span id="toolCategory" class="eyebrow"></span><h2 id="toolTitle"></h2><p id="toolDescription"></p></div><div class="tool-header-actions"><button id="addWorkspaceBtn" class="ghost">＋ 工作台</button><button id="favoriteBtn" class="ghost">☆ 收藏</button></div></header><div id="toolBody"></div></article>
    </section>
  </main>
  <div id="overlay" class="overlay hidden"></div>
  <div id="workspaceModal" class="modal hidden"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div style="padding:20px;text-align:center">Suria Tools 需要启用 JavaScript 才能运行。</div></noscript>
  <script src="bootstrap.js"></script>
</body>
</html>
