name: Vendor jSquash locally

on:
  pull_request:
    paths:
      - '.vendor-jsquash-trigger'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed codec packages
        run: |
          rm -rf vendor/jsquash vendor-jsquash-tmp
          mkdir -p vendor/jsquash vendor-jsquash-tmp
          cd vendor-jsquash-tmp
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund @jsquash/jpeg@1.6.0 @jsquash/webp@1.5.0 wasm-feature-detect@1.8.0
          cd ..
          cp -R vendor-jsquash-tmp/node_modules/@jsquash/jpeg vendor/jsquash/jpeg
          cp -R vendor-jsquash-tmp/node_modules/@jsquash/webp vendor/jsquash/webp
          mkdir -p vendor/jsquash/node_modules
          cp -R vendor-jsquash-tmp/node_modules/wasm-feature-detect vendor/jsquash/node_modules/wasm-feature-detect
          rm -rf vendor-jsquash-tmp
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('vendor/jsquash/webp/encode.js')
          s = p.read_text()
          s = re.sub(r"from\s+['\"]wasm-feature-detect['\"]", "from '../node_modules/wasm-feature-detect/dist/esm/index.js'", s)
          p.write_text(s)
          PY
          echo 'Vendored WASM files:'
          find vendor/jsquash -type f -name '*.wasm' -print
          test "$(find vendor/jsquash/jpeg -type f -name '*.wasm' | wc -l)" -gt 0
          test "$(find vendor/jsquash/webp -type f -name '*.wasm' | wc -l)" -gt 0
      - name: Commit vendored codecs to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/jsquash
          git commit -m 'vendor: localize MozJPEG and libwebp WASM codecs'
          git push origin HEAD:${{ github.head_ref }}
