name: Rotate image codec entry

on:
  push:
    paths:
      - '.rotate-image-codec-trigger'

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create fresh physical entry
        run: |
          cp image-jsquash-tools.js image-codec-tools-20260804-1327.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('image-jsquash-tools.js?v=20260804-3', 'image-codec-tools-20260804-1327.js')
          cleanup = '''<script>
          (async()=>{
            try{
              if('serviceWorker' in navigator){
                const regs=await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(reg=>reg.unregister()));
              }
              if('caches' in window){
                const keys=await caches.keys();
                await Promise.all(keys.map(key=>caches.delete(key)));
              }
            }catch{}
          })();
          </script>'''
          s = s.replace('<script defer src="final.js"></script>', cleanup+'\n  <script defer src="final.js?v=20260804-1327"></script>')
          p.write_text(s)
          PY
          grep -q 'image-codec-tools-20260804-1327.js' index.html
          grep -q 'jsquash-browser/webp.js?v=3' image-codec-tools-20260804-1327.js
      - name: Commit fresh entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html image-codec-tools-20260804-1327.js
          git commit -m 'fix: rotate image codec entry and clear legacy caches'
          git push origin main
