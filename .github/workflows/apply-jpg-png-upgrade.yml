name: Apply JPG PNG upgrade

on:
  push:
    paths:
      - '.apply-jpg-png-upgrade'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download UPNG and apply upgrade
        run: |
          set -euo pipefail
          rm -rf /tmp/upngpkg
          mkdir -p /tmp/upngpkg
          cd /tmp/upngpkg
          npm init -y >/dev/null 2>&1
          npm install upng-js@2.1.0 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          cp /tmp/upngpkg/node_modules/upng-js/UPNG.js vendor/upng.min.js
          cp /tmp/upngpkg/node_modules/upng-js/LICENSE vendor/licenses/upng-MIT.txt
          python3 scripts/upgrade_jpg_png.py
          test "$(wc -c < vendor/upng.min.js)" -gt 30000
          node --check vendor/upng.min.js
          node --check image-codec-tools.js
          grep -q "UPNG 颜色量化" image-codec-tools.js
          grep -q "智能 JPG / PNG" image-codec-tools.js
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image-codec-tools.js index.html runtime-assets.json vendor/upng.min.js vendor/licenses/upng-MIT.txt
          git commit -m 'feat: prioritize JPG and quantized PNG compression'
          git push origin main
