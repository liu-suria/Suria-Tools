name: Vendor browser dependencies

on:
  push:
    paths:
      - .github/workflows/vendor-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned browser libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/licenses

          curl -L --fail --retry 3 --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.0/qrcode.min.js \
            -o vendor/qrcode.min.js

          curl -L --fail --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js \
            -o vendor/jsQR.min.js

          curl -L --fail --retry 3 --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js \
            -o vendor/js-yaml.min.js

          curl -L --fail --retry 3 --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js \
            -o vendor/marked.min.js

          curl -L --fail --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/qrcode@1.5.0/license \
            -o vendor/licenses/qrcode-MIT.txt

          curl -L --fail --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/jsqr@1.4.0/LICENSE \
            -o vendor/licenses/jsQR-Apache-2.0.txt

          curl -L --fail --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/LICENSE \
            -o vendor/licenses/js-yaml-MIT.txt

          curl -L --fail --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/marked@12.0.2/LICENSE.md \
            -o vendor/licenses/marked-MIT.txt

          test "$(wc -c < vendor/qrcode.min.js)" -gt 20000
          test "$(wc -c < vendor/jsQR.min.js)" -gt 200000
          test "$(wc -c < vendor/js-yaml.min.js)" -gt 30000
          test "$(wc -c < vendor/marked.min.js)" -gt 30000

          node --check vendor/qrcode.min.js
          node --check vendor/jsQR.min.js
          node --check vendor/js-yaml.min.js
          node --check vendor/marked.min.js

          cat > vendor/README.md <<'EOF'
          # 本地浏览器依赖

          这些文件固定在仓库中，仅在打开对应工具时按需加载，网站运行不依赖第三方 CDN。

          | 文件 | 包及版本 | 用途 | 许可证 |
          | --- | --- | --- | --- |
          | `qrcode.min.js` | qrcode 1.5.0 | 二维码生成 | MIT |
          | `jsQR.min.js` | jsQR 1.4.0 | 二维码识别 | Apache-2.0 |
          | `js-yaml.min.js` | js-yaml 4.1.0 | YAML / JSON 转换 | MIT |
          | `marked.min.js` | marked 12.0.2 | Markdown 预览 | MIT |

          完整许可证文本位于 `vendor/licenses/`。
          EOF

      - name: Commit vendor files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then
            echo "Vendor files are already up to date."
            exit 0
          fi
          git commit -m "本地化浏览器第三方依赖"
          git push
