name: Vendor jSquash codecs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download fixed codec versions
        run: |
          rm -rf .vendor-tmp vendor/jsquash
          mkdir -p .vendor-tmp vendor/jsquash
          cd .vendor-tmp
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund @jsquash/jpeg@1.6.0 @jsquash/webp@1.5.0
          cd ..
          cp -R .vendor-tmp/node_modules/@jsquash/jpeg vendor/jsquash/jpeg
          cp -R .vendor-tmp/node_modules/@jsquash/webp vendor/jsquash/webp
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vendor/jsquash/webp/encode.js')
          text = path.read_text()
          text = text.replace("import { simd } from 'wasm-feature-detect';", "const simd = async () => false;")
          path.write_text(text)
          PY
          rm -rf .vendor-tmp
          cat > vendor/jsquash/README.md <<'EOF'
          # jSquash 本地图片编码器

          - @jsquash/jpeg 1.6.0：MozJPEG WebAssembly
          - @jsquash/webp 1.5.0：libwebp WebAssembly

          两者均使用 Apache-2.0 许可证并随站点本地部署，不依赖 CDN。
          EOF
      - name: Commit vendored codecs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/jsquash
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m '本地化 MozJPEG 与 WebP WASM 编码器'
            git push origin main
          fi
